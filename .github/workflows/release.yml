name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Package VSIX (RELEASE)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx vsce package -o "gh-tracker-${VERSION}-RELEASE.vsix"

      - name: Upload Release Asset
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "gh-tracker-$(node -p "require('./package.json').version")-RELEASE.vsix" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
